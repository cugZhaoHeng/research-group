<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 课题组信息管理系统</title>
  <link rel="stylesheet" href="https://www.jeasyui.com/easyui/themes/default/easyui.css">
  <link rel="stylesheet" href="https://www.jeasyui.com/easyui/themes/icon.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="page-login">
  <div class="login-shell">
    <section class="brand-panel">
      <div>
        <p class="eyebrow">Research Group</p>
        <h1>课题组信息管理系统</h1>
        <p class="subtitle">统一记录成员信息、论文发表、获奖、组会、团建和比赛活动。</p>
      </div>
    </section>

    <section class="auth-panel">
      <div class="login-card">
        <h2>账号登录</h2>
        <form id="loginForm" class="form-grid">
          <input class="easyui-textbox" name="username" label="用户名" labelPosition="top" data-options="required:true">
          <input class="easyui-passwordbox" name="password" label="密码" labelPosition="top" data-options="required:true">
          <a href="javascript:void(0)" class="easyui-linkbutton primary-action" data-options="iconCls:'icon-ok'" onclick="login()">登录</a>
        </form>
      </div>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.jeasyui.com/easyui/jquery.easyui.min.js"></script>
  <script src="https://www.jeasyui.com/easyui/locale/easyui-lang-zh_CN.js"></script>
  <script src="./app.js"></script>
</body>
</html>
